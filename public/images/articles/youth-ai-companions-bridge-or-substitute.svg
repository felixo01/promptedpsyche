<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A conversation branches toward connection or repetition</title>
  <desc id="desc">An editorial diagram in muted teal and warm gray. A pair of message shapes leads through a field of contextual signals, then divides into an open bridge toward connected nodes and a closed conversational loop.</desc>
  <defs>
    <pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#f7f3ea"/>
      <path d="M0 24L24 0" fill="none" stroke="#e6ded0" stroke-width="0.45" opacity="0.4"/>
    </pattern>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#536965" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-warm" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" fill="none" stroke="#8c9893" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)"/>

