    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FBFAF6" stop-opacity="0.98"/>
      <stop offset="52%" stop-color="#C3944E" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#C3944E" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrowTeal" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2 2L12 7L2 12" fill="none" stroke="#536965" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowWarm" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
